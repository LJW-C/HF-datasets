name: Python syntax check

on:
  push:
  pull_request:

jobs:
  py_compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: |
          python -m compileall \
            generate_fldigi_wavs.py \
            validate_raw_wavs.py \
            build_panoradio_like_dataset.py \
            visualize_iq_samples.py \
            diagnose_mode_visuals.py \
            train_rf_classifier.py \
            run_model_suite.py \
            summarize_model_results.py \
            make_paper_results.py \
            rfml_benchmark \
            scripts
